# The host-network tunnel reaches the published port through this compose
# network's bridge gateway. Only trust CF-Connecting-IP on that exact internal
# hop; a direct LAN or Tailscale request keeps its real source address.
#
# If Docker recreates boxbox-replay_default with a different gateway, update
# this value and tests/test_cloudflare_config.py.
map $remote_addr $boxbox_trust_cf {
    default 0;
    127.0.0.1 1;
    ::1 1;
    172.23.0.1 1;
}
map "$boxbox_trust_cf:$http_cf_connecting_ip" $boxbox_client_ip {
    default $remote_addr;
    "1:" $remote_addr;
    ~^1:.+$ $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 256k;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $boxbox_client_ip;
        proxy_set_header X-Forwarded-For $boxbox_client_ip;
        proxy_read_timeout 300s;
    }

    # Hashed assets can be cached forever; the HTML that names them cannot.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
