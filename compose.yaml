# Base definitions, environment-agnostic. No `version:` key (Compose v2).
services:
  api:
    build: .
    image: boxbox-replay-api:local
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      OPENF1_BASE_URL: ${OPENF1_BASE_URL:-https://api.openf1.org/v1}
      CACHE_DIR: /app/data/cache
    expose:
      - "8000"
  web:
    build: ./web
    image: boxbox-replay-web:local
    ports:
      - "${APP_PORT:-8501}:80"
    depends_on:
      api:
        condition: service_healthy
